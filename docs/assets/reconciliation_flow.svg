<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="50%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E33" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0E1729" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="transferGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="refundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="duplicateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulseEngine1 {
        0%, 100% { stroke: #00F2FE; filter: drop-shadow(0 0 6px #00F2FE); }
        50% { stroke: #38BDF8; filter: drop-shadow(0 0 14px #00F2FE); }
      }
      @keyframes pulseEngine2 {
        0%, 100% { stroke: #10B981; filter: drop-shadow(0 0 6px #10B981); }
        50% { stroke: #34D399; filter: drop-shadow(0 0 14px #10B981); }
      }
      @keyframes pulseEngine3 {
        0%, 100% { stroke: #F59E0B; filter: drop-shadow(0 0 6px #F59E0B); }
        50% { stroke: #FBBF24; filter: drop-shadow(0 0 14px #F59E0B); }
      }
      @keyframes flowParticles {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .engine-pulse-1 { animation: pulseEngine1 3s infinite ease-in-out; }
      .engine-pulse-2 { animation: pulseEngine2 3.2s infinite ease-in-out 0.5s; }
      .engine-pulse-3 { animation: pulseEngine3 2.8s infinite ease-in-out 1s; }
      .flow-line { stroke-dasharray: 6 4; animation: flowParticles 1.5s linear infinite; }
      .card-float-1 { animation: floatCard 4s ease-in-out infinite; }
      .card-float-2 { animation: floatCard 4.2s ease-in-out infinite 0.7s; }
      .card-float-3 { animation: floatCard 3.8s ease-in-out infinite 1.4s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="940" height="320" rx="16" fill="url(#flowBg)"/>
  
  <!-- Subtle Header -->
  <g transform="translate(40, 32)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#00F2FE" letter-spacing="1.5">
      TRI-ENGINE DETERMINISTIC &amp; HEURISTIC PIPELINE
    </text>
    <text y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">
      Full multimodal reconciliation handling cross-account transfers, merchant refunds, and duplicate transaction protection.
    </text>
  </g>

  <!-- ==================== ENGINE 1: INTERNAL TRANSFERS ==================== -->
  <g transform="translate(40, 80)">
    <g class="card-float-1">
      <rect width="265" height="205" rx="12" fill="url(#cardBg)" class="engine-pulse-1" stroke="#00F2FE" stroke-width="1.2"/>
      
      <!-- Header Badge -->
      <g transform="translate(16, 16)">
        <rect width="130" height="22" rx="6" fill="#00F2FE" fill-opacity="0.15"/>
        <circle cx="12" cy="11" r="3.5" fill="#00F2FE"/>
        <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38BDF8" letter-spacing="0.5">
          ENGINE 01 • TRANSFERS
        </text>
      </g>

      <!-- Content -->
      <text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
        Inter-Account Pairing
      </text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#94A3B8">
        Dual-leg matching across user bank vaults with date gap &amp; reference heuristics.
      </text>

      <!-- Visual Match Simulation -->
      <g transform="translate(16, 100)">
        <rect width="233" height="42" rx="8" fill="#0A101D" stroke="#1E293B" stroke-width="0.8"/>
        <!-- Debit Node -->
        <circle cx="20" cy="21" r="8" fill="#EF4444" fill-opacity="0.2"/>
        <text x="20" y="24" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#EF4444">Dr</text>
        <!-- Connecting Line -->
        <line x1="36" y1="21" x2="195" y2="21" stroke="#334155" stroke-width="1.5"/>
        <line class="flow-line" x1="36" y1="21" x2="195" y2="21" stroke="#00F2FE" stroke-width="1.5"/>
        <!-- Credit Node -->
        <circle cx="212" cy="21" r="8" fill="#10B981" fill-opacity="0.2"/>
        <text x="212" y="24" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#10B981">Cr</text>
        <!-- Center Indicator -->
        <rect x="80" y="11" width="72" height="20" rx="4" fill="#00F2FE" fill-opacity="0.2"/>
        <text x="116" y="24" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#00F2FE">#TRF601</text>
      </g>

      <!-- Metrics Footer -->
      <text x="16" y="174" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#10B981">
        ✓ Strict User Isolation
      </text>
      <text x="16" y="190" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#64748B">
        Confidence: 99.8% • Δ 0-1 Days
      </text>
    </g>
  </g>

  <!-- ==================== ENGINE 2: REFUND ALLOCATOR ==================== -->
  <g transform="translate(337, 80)">
    <g class="card-float-2">
      <rect width="265" height="205" rx="12" fill="url(#cardBg)" class="engine-pulse-2" stroke="#10B981" stroke-width="1.2"/>
      
      <!-- Header Badge -->
      <g transform="translate(16, 16)">
        <rect width="125" height="22" rx="6" fill="#10B981" fill-opacity="0.15"/>
        <circle cx="12" cy="11" r="3.5" fill="#10B981"/>
        <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#34D399" letter-spacing="0.5">
          ENGINE 02 • REFUNDS
        </text>
      </g>

      <!-- Content -->
      <text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
        Purchase-to-Credit Pairing
      </text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#94A3B8">
        Supports partial &amp; full return allocations with remaining balance tracking.
      </text>

      <!-- Visual Match Simulation -->
      <g transform="translate(16, 100)">
        <rect width="233" height="42" rx="8" fill="#0A101D" stroke="#1E293B" stroke-width="0.8"/>
        <!-- Purchase Item -->
        <text x="12" y="18" font-family="monospace" font-size="8.5" font-weight="700" fill="#EF4444">PURCHASE: ₹8,499</text>
        <!-- Remaining Track Bar -->
        <rect x="12" y="24" width="209" height="5" rx="2.5" fill="#1E293B"/>
        <rect x="12" y="24" width="135" height="5" rx="2.5" fill="#10B981"/>
        <text x="12" y="38" font-family="monospace" font-size="7.5" font-weight="600" fill="#10B981">REFUNDED: ₹5,499 (F771)</text>
        <text x="160" y="38" font-family="monospace" font-size="7.5" font-weight="600" fill="#64748B">REM: ₹3,000</text>
      </g>

      <!-- Metrics Footer -->
      <text x="16" y="174" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#10B981">
        ✓ Over-Refund Guard
      </text>
      <text x="16" y="190" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#64748B">
        Supports Multi-Partial Returns
      </text>
    </g>
  </g>

  <!-- ==================== ENGINE 3: DUPLICATE DETECTOR ==================== -->
  <g transform="translate(635, 80)">
    <g class="card-float-3">
      <rect width="265" height="205" rx="12" fill="url(#cardBg)" class="engine-pulse-3" stroke="#F59E0B" stroke-width="1.2"/>
      
      <!-- Header Badge -->
      <g transform="translate(16, 16)">
        <rect width="135" height="22" rx="6" fill="#F59E0B" fill-opacity="0.15"/>
        <circle cx="12" cy="11" r="3.5" fill="#F59E0B"/>
        <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#FBBF24" letter-spacing="0.5">
          ENGINE 03 • DUPLICATES
        </text>
      </g>

      <!-- Content -->
      <text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
        Sliding Window Guard
      </text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#94A3B8">
        Identifies accidental double charges, batch overlap, and identical narration collisions.
      </text>

      <!-- Visual Match Simulation -->
      <g transform="translate(16, 100)">
        <rect width="233" height="42" rx="8" fill="#0A101D" stroke="#1E293B" stroke-width="0.8"/>
        <!-- Tx 1 -->
        <circle cx="16" cy="14" r="4" fill="#F59E0B"/>
        <text x="26" y="17" font-family="monospace" font-size="8.5" font-weight="600" fill="#E2E8F0">Tx #129: SWIGGY ₹540.00</text>
        <!-- Tx 2 -->
        <circle cx="16" cy="30" r="4" fill="#EF4444"/>
        <text x="26" y="33" font-family="monospace" font-size="8.5" font-weight="600" fill="#EF4444">Tx #130: SWIGGY ₹540.00 (DUP)</text>
      </g>

      <!-- Metrics Footer -->
      <text x="16" y="174" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#F59E0B">
        ✓ Double-Billing Protection
      </text>
      <text x="16" y="190" font-family="SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600" fill="#64748B">
        Jaccard + Levenshtein Matching
      </text>
    </g>
  </g>
</svg>
